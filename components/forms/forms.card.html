<!-- @dsCard group="Components" viewport="700x330" name="Forms" subtitle="Input, Textarea, Select, Checkbox, Radio, Switch, FieldGroup" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:#fff}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:600 10px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, Checkbox, Radio, Switch, FieldGroup } = window.RiteDesignSystem_277c56;
function Demo(){const[c,setC]=React.useState(true);const[s,setS]=React.useState(true);const[r,setR]=React.useState('full');
return(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:18}}>
<div className="col">
<FieldGroup label="Project" htmlFor="a"><Input id="a" defaultValue="Cianbro HCM" icon="folder" /></FieldGroup>
<FieldGroup label="Search" htmlFor="b"><Input id="b" placeholder="Search objects" icon="search" size="sm" /></FieldGroup>
<FieldGroup label="Contract value" htmlFor="c"><Input id="c" defaultValue="240,000" suffix="USD" /></FieldGroup>
</div>
<div className="col">
<FieldGroup label="Source system" htmlFor="d" hint="Where the data is read from"><Select id="d" options={[{value:'ebs',label:'Oracle EBS'},{value:'sf',label:'Salesforce'}]} /></FieldGroup>
<FieldGroup label="Object code" htmlFor="e" error="Value already in use"><Input id="e" defaultValue="HCM_WKR_01" invalid /></FieldGroup>
<FieldGroup label="Notes" htmlFor="f"><Textarea id="f" rows={2} placeholder="Describe the exception" /></FieldGroup>
</div>
<div className="col">
<div className="lbl">Selection</div>
<Checkbox checked={c} onChange={setC} label="Validate before load" />
<Checkbox indeterminate label="Select all objects" />
<Checkbox disabled label="Locked by admin" />
<Radio checked={r==='full'} onChange={()=>setR('full')} label="Full load" description="Truncates the target first" />
<Radio checked={r==='inc'} onChange={()=>setR('inc')} label="Incremental" />
<Switch checked={s} onChange={setS} label="Auto-map columns" />
<Switch checked={false} onChange={()=>{}} label="Email on failure" />
</div></div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
