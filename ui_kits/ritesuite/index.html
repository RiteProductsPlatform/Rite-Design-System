<!-- @dsCard group="RiteSuite" viewport="1440x900" name="RiteSuite console" subtitle="Interactive shell — sign in, overview, ConvertRite, BidRite, engagement detail" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>RiteSuite console</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script>window.RiteDS = window.RiteDesignSystem_277c56;</script>
<style>html,body,#root{height:100%;margin:0}body{background:var(--surface-page);overflow:hidden}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="SignIn.jsx"></script>
<script type="text/babel" src="Overview.jsx"></script>
<script type="text/babel" src="ConvertRite.jsx"></script>
<script type="text/babel" src="BidRite.jsx"></script>
<script type="text/babel" src="ProjectDetail.jsx"></script>
<script type="text/babel">
const { Button, Breadcrumbs, EmptyState } = window.RiteDS;

const TITLES = {
  overview: { eyebrow: 'Workspace', title: 'Portfolio overview' },
  projects: { eyebrow: 'Workspace', title: 'Engagements' },
  convertrite: { eyebrow: 'ConvertRite', title: 'Cianbro HCM conversion' },
  bidrite: { eyebrow: 'BidRite', title: 'Bid pipeline' },
  revrite: { eyebrow: 'RevRite', title: 'Opportunity to cash' },
  wagerite: { eyebrow: 'WageRite', title: 'Payroll processing' },
  lienrite: { eyebrow: 'LienRite', title: 'Lien waivers' },
  cowork: { eyebrow: 'CoWork', title: 'Contingent workforce' },
  analytics: { eyebrow: 'Rite Analytics', title: 'Warehouse & dashboards' },
  discovery: { eyebrow: 'DiscoveryAI', title: 'Requirement discovery' },
  project: { eyebrow: 'Engagement', title: 'Cianbro · HCM + Payroll' },
};

function App() {
  const [authed, setAuthed] = React.useState(false);
  const [view, setView] = React.useState('overview');
  if (!authed) return <SignIn onSignIn={() => setAuthed(true)} />;

  const meta = TITLES[view] || TITLES.overview;
  const actions = view === 'convertrite' ? <Button size="sm" variant="secondary" icon="settings-2">Configure</Button>
    : view === 'overview' ? <Button size="sm" icon="plus">New engagement</Button> : null;

  let body;
  if (view === 'overview') body = <Overview onOpenModule={(m) => setView(m.toLowerCase())} onOpenProject={() => setView('project')} />;
  else if (view === 'convertrite') body = <ConvertRite />;
  else if (view === 'bidrite') body = <BidRite />;
  else if (view === 'project' || view === 'projects') body = <ProjectDetail />;
  else body = (
    <EmptyState icon="hard-hat" title={meta.title + ' is not in this kit'}
      description="No source screens were supplied for this module, so it is intentionally left blank rather than invented."
      action={<Button size="sm" variant="secondary" onClick={() => setView('overview')}>Back to overview</Button>} />
  );

  return (
    <AppShell
      view={view === 'project' ? 'projects' : view}
      onNavigate={setView}
      title={meta.title}
      eyebrow={view === 'project' ? undefined : meta.eyebrow}
      breadcrumbs={view === 'project'
        ? <Breadcrumbs items={[{ id: 'overview', label: 'RiteSuite' }, { id: 'projects', label: 'Engagements' }, { label: 'Cianbro' }]} onNavigate={setView} />
        : undefined}
      actions={actions}
    >{body}</AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
