<!-- @dsCard group="Spacing" viewport="700x170" name="Interaction states" subtitle="Hover darkens, press darkens again, focus is a 2px green ring" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:#fff;font:var(--type-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:8px;overflow:hidden;border:1px solid var(--border-subtle)}.sw .c{height:56px}.sw .m{padding:7px 9px;display:flex;flex-direction:column;gap:2px}.n{font:500 11px/1.2 var(--font-sans);color:var(--text-primary)}.h{font:400 10px/1.2 var(--font-mono);color:var(--text-tertiary);text-transform:uppercase}</style></head><body><div style="display:flex;gap:26px;align-items:center">
<div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:8px"><div style="height:40px;padding:0 16px;display:flex;align-items:center;background:#006F53;color:#fff;border-radius:8px;font:500 14px/1 var(--font-sans)">Rest</div><div style="height:40px;padding:0 16px;display:flex;align-items:center;background:#0E3A2C;color:#fff;border-radius:8px;font:500 14px/1 var(--font-sans)">Hover</div><div style="height:40px;padding:0 16px;display:flex;align-items:center;background:#06211A;color:#fff;border-radius:8px;font:500 14px/1 var(--font-sans)">Press</div><div style="height:40px;padding:0 16px;display:flex;align-items:center;background:#E3EAE7;color:#9A9A9A;border-radius:8px;font:500 14px/1 var(--font-sans)">Disabled</div></div>
<div style="display:flex;gap:8px"><div style="height:40px;padding:0 16px;display:flex;align-items:center;background:#fff;border:1px solid #CDD9D5;border-radius:8px;font:500 14px/1 var(--font-sans)">Secondary</div><div style="height:40px;padding:0 16px;display:flex;align-items:center;background:#F2F4F3;border:1px solid #CDD9D5;border-radius:8px;font:500 14px/1 var(--font-sans)">Hover</div><div style="height:40px;padding:0 16px;display:flex;align-items:center;background:#fff;border:1px solid #CDD9D5;border-radius:8px;font:500 14px/1 var(--font-sans);outline:2px solid #006F53;outline-offset:2px">Focus</div></div></div>
<div class="h" style="line-height:1.8">#006F53 → #0E3A2C → #06211A<br>ghost: transparent → #F2F4F3 → #E3EAE7<br>focus: 2px #006F53, 2px offset</div></div></body></html>
