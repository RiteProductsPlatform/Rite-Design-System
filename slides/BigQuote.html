<!-- @dsCard group="Slides" viewport="1280x720" name="Big quote" subtitle="Georgia pull quote on Tiber with mint quotation mark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Big quote</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:#fff}.slide{width:1280px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-sans)}
.pad{padding:72px 88px}.dark{background:var(--rite-deep-forest);color:#fff}.tiber{background:var(--rite-tiber);color:#fff}.light{background:#F9F9F9;color:var(--text-primary)}
.eb{font:600 15px/1.2 var(--font-sans);letter-spacing:.18em;text-transform:uppercase}
.eb.m{color:var(--rite-signal-mint)}.eb.g{color:var(--rite-tropical-rainforest)}
.rule{width:120px;height:5px;background:var(--rite-signal-mint);border-radius:999px}
.foot{position:absolute;left:88px;right:88px;bottom:40px;display:flex;align-items:center;justify-content:space-between;font:400 15px/1 var(--font-sans)}
.wm{position:absolute;pointer-events:none}</style></head><body><div class="slide tiber pad" style="justify-content:center">
<img class="wm" src="../assets/illustrations/deco-arc-dashed.png" style="left:-140px;top:-120px;width:520px;opacity:.55">
<div style="position:relative;display:flex;gap:36px;max-width:960px;align-self:center">
<span style="font:400 160px/.72 var(--font-serif);color:var(--rite-signal-mint)">&ldquo;</span>
<div style="display:flex;flex-direction:column;gap:36px;padding-top:12px">
<p style="font:400 44px/1.35 var(--font-serif);color:#fff">We never announced ourselves. We just kept showing up, and kept getting it right.</p>
<div style="display:flex;align-items:center;gap:16px">
<span style="width:52px;height:3px;background:var(--rite-signal-mint);border-radius:999px"></span>
<span style="font:500 19px/1.3 var(--font-sans);color:#fff">Sai Vudata<span style="color:var(--rite-sage);font-weight:400"> · Founder &amp; CEO</span></span>
</div></div></div><div class="foot" style="color:rgba(255,255,255,.5)"><img src="../assets/logo/rite-wordmark-white.png" style="height:20px;opacity:.6"><span style="font-family:var(--font-mono);font-size:14px">52</span></div></div></body></html>
