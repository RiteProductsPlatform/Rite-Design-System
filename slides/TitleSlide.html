<style>html,body{margin:0;background:#fff}.slide{width:1280px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-sans)}

<div class="eb m">All hands · August 2026</div>

</div><div class="foot" style="color:rgba(255,255,255,.5)"><img src="../assets/logo/rite-wordmark-white.png" style="height:20px;opacity:.6"><span style="font-family:var(--font-mono);font-size:14px">01</span></div></div></body></html>
