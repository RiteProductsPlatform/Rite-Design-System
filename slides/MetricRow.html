<!-- @dsCard group="Slides" viewport="1280x720" name="Metrics" subtitle="Big figures over lowercase labels, mint deltas" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Metric row</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:#fff}.slide{width:1280px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-sans)}
.pad{padding:72px 88px}.dark{background:var(--rite-deep-forest);color:#fff}.tiber{background:var(--rite-tiber);color:#fff}.light{background:#F9F9F9;color:var(--text-primary)}
.eb{font:600 15px/1.2 var(--font-sans);letter-spacing:.18em;text-transform:uppercase}
.eb.m{color:var(--rite-signal-mint)}.eb.g{color:var(--rite-tropical-rainforest)}
.rule{width:120px;height:5px;background:var(--rite-signal-mint);border-radius:999px}
.foot{position:absolute;left:88px;right:88px;bottom:40px;display:flex;align-items:center;justify-content:space-between;font:400 15px/1 var(--font-sans)}
.wm{position:absolute;pointer-events:none}</style></head><body><div class="slide light pad">
<div style="display:flex;flex-direction:column;gap:20px">
<div class="eb g">Market intelligence</div>
<h2 style="font:700 52px/1.12 var(--font-sans);letter-spacing:-.02em;max-width:900px">The Oracle services market is not slowing down</h2>
<div class="rule"></div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:64px">
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:baseline;gap:14px"><span style="font:700 76px/1 var(--font-sans);letter-spacing:-.03em">$865B</span><span style="font:500 22px/1 var(--font-mono);color:var(--rite-tropical-rainforest)">&nbsp;</span></div>
<span style="font:400 19px/1.35 var(--font-sans);color:var(--text-tertiary)">Market size, 2025</span></div><div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:baseline;gap:14px"><span style="font:700 76px/1 var(--font-sans);letter-spacing:-.03em">$1.18T</span><span style="font:500 22px/1 var(--font-mono);color:var(--rite-tropical-rainforest)">+36%</span></div>
<span style="font:400 19px/1.35 var(--font-sans);color:var(--text-tertiary)">Projected, 2035</span></div><div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:baseline;gap:14px"><span style="font:700 76px/1 var(--font-sans);letter-spacing:-.03em">20</span><span style="font:500 22px/1 var(--font-mono);color:var(--rite-tropical-rainforest)">&nbsp;</span></div>
<span style="font:400 19px/1.35 var(--font-sans);color:var(--text-tertiary)">Years of Rite</span></div><div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:baseline;gap:14px"><span style="font:700 76px/1 var(--font-sans);letter-spacing:-.03em">0</span><span style="font:500 22px/1 var(--font-mono);color:var(--rite-tropical-rainforest)">&nbsp;</span></div>
<span style="font:400 19px/1.35 var(--font-sans);color:var(--text-tertiary)">Failed go-lives</span></div>
</div>
<div style="margin-top:56px;padding-top:28px;border-top:1px solid var(--border-default);font:400 17px/1.4 var(--font-sans);color:var(--text-tertiary)">$865B → $1.18T &nbsp;·&nbsp; Source: Expert Market Research, 2025–2035</div>
<div class="foot" style="color:var(--text-tertiary)"><img src="../assets/logo/rite-wordmark-dark.png" style="height:20px;opacity:.55"><span style="font-family:var(--font-mono);font-size:14px">24</span></div></div></body></html>
